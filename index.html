<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mech Sketch</title>
<meta name="theme-color" content="#e7ebe5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<div id="app">
  <header class="topbar">
    <span class="brand">Mech Sketch</span>
    <div class="group" id="file-actions">
      <button type="button" class="text-btn" data-act="new">New</button>
      <button type="button" class="text-btn" data-act="open">Open</button>
      <button type="button" class="text-btn" data-act="save">Save</button>
    </div>
    <div class="group menu" id="export-menu">
      <button type="button" class="text-btn menu-btn" id="export-btn" data-menu="export" aria-haspopup="menu" aria-expanded="false" aria-controls="export-list" title="Save or copy the figure for LaTeX">Export<svg class="caret" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5l3 3 3-3"/></svg></button>
      <div class="menu-list" id="export-list" role="menu" aria-labelledby="export-btn" hidden>
        <button type="button" role="menuitem" data-act="export-svg"><span>SVG</span><span class="menu-note">.svg file</span></button>
        <button type="button" role="menuitem" data-act="export-tikz"><span>TikZ</span><span class="menu-note">.tex file</span></button>
        <button type="button" role="menuitem" data-act="copy-tikz"><span>Copy TikZ</span><span class="menu-note">to the clipboard</span></button>
      </div>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Tool sets"></div>
    <div class="spacer"></div>
    <div class="group" id="view-actions" role="toolbar" aria-label="History and view"></div>
  </header>
  <nav class="ribbon" id="ribbon" role="toolbar"></nav>
  <main class="stage" id="stage">
    <svg id="canvas" role="img" aria-label="Sketch"></svg>
    <div class="empty" id="empty">
      <p class="empty-title">GLHF with the homework</p>
    </div>
    <div class="titleblock" id="titleblock"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <input class="dim-editor" id="dim-editor" type="text" inputmode="decimal" aria-label="Dimension value" hidden>
  </main>
  <aside class="panel" id="panel" aria-label="Selection"></aside>
  <footer class="statusbar"><span id="hint"></span><span id="coords"></span></footer>
</div>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<dialog id="name-dialog" aria-labelledby="name-title">
  <form method="dialog">
    <h2 id="name-title">Export</h2>
    <label class="field"><span>File name</span>
      <span class="name-row"><input id="name-input" type="text" spellcheck="false" autocomplete="off"><span id="name-ext">.svg</span></span>
    </label>
    <div class="dialog-actions">
      <button type="button" data-dialog="cancel">Cancel</button>
      <button type="submit" value="ok" class="primary">Save</button>
    </div>
  </form>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
